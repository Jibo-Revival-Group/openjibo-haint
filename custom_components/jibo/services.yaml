say:
  name: Speak
  description: Make a Jibo robot say something.
  fields:
    message:
      name: Message
      description: The text to speak.
      example: "Hello, Home Assistant!"
      required: true
      selector:
        text:
    robot:
      name: Robots
      description: >
        Select one or more robots. Leave empty to speak on all configured
        Jibo robots.
      required: false
      selector:
        device:
          filter:
            - integration: jibo
          multiple: true
